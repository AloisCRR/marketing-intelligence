# Local dev stack — Marketing Intelligence (Ticket 01).
#
# Bring up the DB:
#   docker compose up -d db        # start Postgres 18 + pgvector
#   docker compose logs -f db      # watch readiness
#   docker compose down            # stop (data persists on named volume `pgdata`)
#   docker compose down -v         # DANGER: deletes the pgdata volume + all data
#
# Persistence check (ADR-0001): seed or insert a row, run
# `docker compose down && docker compose up -d db`, and confirm the data
# is still there. Data lives on the named volume `pgdata` mounted at the
# PG18 path /var/lib/postgresql (NOT the pre-18 /var/lib/postgresql/data
# subpath — mounting the old path creates anonymous volumes).
#
# App connection (see .env.example):
#   DATABASE_URL=postgresql://brain:brain@localhost:5433/brain
#
# Deploy stack (Dokploy + local `docker compose up -d --build`): single image
# (Dockerfile at repo root), three services sharing it —
#   migrate  one-shot: runs marketing_intelligence.db.apply_migrations() (idempotent), then exits
#   api      FastAPI on internal 8123 (default image CMD)
#   mcp      MCP streamable-HTTP on internal 8124 (CMD override, see NOTE below)
# Plain HTTP only — Traefik terminates TLS outside the containers.
# Local-only DB flow is unchanged: `docker compose up -d db` still works.

# Shared build definition (top-level extension field — ignored as a service).
x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

services:
  db:
    # Pinned PG18 + pgvector image (verified to exist; trixie variant).
    # Fallback if trixie is ever pulled: pgvector/pgvector:0.8.6-pg18-bookworm.
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: marketing-intelligence-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brain}
      POSTGRES_DB: ${POSTGRES_DB:-brain}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Named volume at the PG18 parent path. No anonymous volumes.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-brain}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Shared build definition anchor: api/mcp/migrate all run this image.
  migrate:
    build: *app-build
    image: marketing-intelligence-app:local
    container_name: marketing-intelligence-migrate
    command: ["python", "-c", "from marketing_intelligence.db import apply_migrations; apply_migrations()"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://brain:brain@db:5432/brain}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: *app-build
    image: marketing-intelligence-app:local
    container_name: marketing-intelligence-api
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8123"]
    environment:
      PORT: "8123"
      DATABASE_URL: ${DATABASE_URL:-postgresql://brain:brain@db:5432/brain}
      BRAIN_API_TOKEN: ${BRAIN_API_TOKEN:-}
      BRAIN_PUBLIC_URL: ${BRAIN_PUBLIC_URL:-http://localhost:8124}
    ports:
      - "${API_PORT:-8123}:8123"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - default
      - dokploy-network
    restart: unless-stopped

  mcp:
    build: *app-build
    image: marketing-intelligence-app:local
    container_name: marketing-intelligence-mcp
    # NOTE: NOT `mcp.server:http_app` — local src/mcp/ has no __init__.py, so
    # plain `import mcp` resolves to the installed distribution. `--app-dir`
    # imports our server.py as top-level `server` instead.
    command:
      [
        "uvicorn",
        "--app-dir",
        "src/mcp",
        "server:http_app",
        "--host",
        "0.0.0.0",
        "--port",
        "8124",
      ]
    environment:
      PORT: "8124"
      DATABASE_URL: ${DATABASE_URL:-postgresql://brain:brain@db:5432/brain}
      BRAIN_API_TOKEN: ${BRAIN_API_TOKEN:-}
      BRAIN_PUBLIC_URL: ${BRAIN_PUBLIC_URL:-http://localhost:8124}
    ports:
      - "${MCP_PORT:-8124}:8124"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - default
      - dokploy-network
    restart: unless-stopped

  # Worker (Dokploy: always on; local: `docker compose up -d worker`).
  # Runs against the VPS Prefect server (see PREFECT_API_URL) on pool `brain-pool`.
  # Shares the app image (prefect is a main dependency). `db` resolves via the
  # default compose network; `prefect-server` resolves via `dokploy-network`.
  worker:
    build: *app-build
    image: marketing-intelligence-app:local
    container_name: marketing-intelligence-worker
    command: ["prefect", "worker", "start", "--pool", "${PREFECT_WORK_POOL:-brain-pool}"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://brain:brain@db:5432/brain}
      PREFECT_API_URL: ${PREFECT_API_URL:-http://prefect-server:4200/api}
      PREFECT_API_AUTH_STRING: ${PREFECT_API_AUTH_STRING:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - default
      - dokploy-network
    restart: unless-stopped

volumes:
  pgdata:

networks:
  dokploy-network:
    external: true
