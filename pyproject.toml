[project]
name = "trend-intelligence-brain"
version = "0.1.0"
description = "Trend Intelligence Brain — curated-source intelligence platform"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.1",
  "prefect>=3.0",
  "feedparser>=6.0",
  "python-dateutil>=2.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "mcp==1.29.1",
  "httpx>=0.28",
  "curl-cffi>=0.11",
  "trafilatura>=2.0",
  "yoyo-migrations>=9.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "mypy>=1.0",
  "ruff>=0.14",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
